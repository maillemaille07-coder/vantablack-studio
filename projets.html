<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const B = (id) => 'assets/' + id + '.mp4';
    // classement par contenu réel de chaque vidéo : 4 catégories, ordre alterné horizontal / vertical
    const V = (id) => ({ src: B(id), v: true });
    const H = (id) => ({ src: B(id), v: false });
    const cats = [
      {
        key: 'story', title: 'Storytelling', type: 'rise',
        items: [
          H('4fb1e1c89a8d6ec829f1c3623a6c0c93'), H('b80083bd8b3c1bedafe4f905628748c9'), H('e56ec5748c95fc8d3eee52194fdae3e0'),
          H('4d51ecd9dbe2fa4a58fbcfe89f6d466b'), H('3881b545fae019757ece5b10603a2f27'),
        ],
      },
      {
        key: 'sport', title: 'Nutrition & sport', type: 'side',
        items: [
          H('2cb18033e68df41f4fff5b2b85cba892'), H('844edad1aea1ea7b0f1a7ceff208fc7c'), H('faccaf4654f6057dca5d40979a34937d'),
          H('d791ac41e13a913c9df4f2e87ce642ee'), H('c70f411b84931a608de2bbf84977e309'),
        ],
      },
      {
        key: 'street', title: 'Streetwear & mode', type: 'zoom',
        items: [
          V('233dfc1329a20310692a434049fb4057'), V('befe0ba38a1c597e451f9633cdfc4664'), V('50fc4a3bff267ec59bfab1a12ff9fa01'),
          V('0833f05a99d35c381cb010935bd97d66'), V('5f9fb2997da7368aed637ba3ad9bcf7c'), V('c660d9ef68130c499c429019f2a54631'),
        ],
      },
      {
        key: 'ads', title: 'ADS', type: 'wipe',
        items: [
          V('6bd0ff214cb32f45089782017eab7cc9'), V('f2b8ce9acb8b6951f732264b680522d7'), V('8a191a4d42f05a64ceee999aa6e316b6'),
          V('17a1246ff540c8f41604577456e478ef'), V('e9efd7eb11028ab2c2caade8c3664127'), V('eab5040028fd14ea5cbfd612f37d39b8'),
        ],
      },
      {
        key: 'immo', title: 'Immobilier', type: 'rise',
        items: [
          H('f7ae048d0a3373b94924184f9c6e38a3'), V('9f0863118a2cfc44281245a01660aaee'), V('606150a22b49a4bbe76e4dbdc3de8897'),
          V('7abfb0d2998cd949c3a34610a3513f30'), V('b733f3f7546eda04a36e6968f0f8bdf9'),
        ],
      },
    ];
    this.cats = cats.map((c, ci) => ({ title: c.title, first: 0, ci }));
    this.pages = [];
    cats.forEach((c, ci) => {
      this.cats[ci].first = this.pages.length;
      c.items.forEach((it, k) => {
        this.pages.push({
          key: c.key + k, title: c.title, fmt: it.v ? 'Vertical' : 'Horizontal', type: c.type, ci, k, n: c.items.length,
          uw: it.v ? 9 : 16, uh: it.v ? 16 : 9,
          tiles: [{ src: it.src, x: 0, y: 0, w: it.v ? 9 : 16, h: it.v ? 16 : 9 }],
        });
      });
    });
    this.pages.forEach((pg, pi) => pg.tiles.forEach((t) => {
      t.pg = pi;
      t.cat = pg.title;
      t.v = t.h > t.w;
      t.name = pg.title + ' ' + String(pg.k + 1).padStart(2, '0');
    }));
    this.state = { sf: 0, open: null, rz: 0 };
    this.target = 0;
    this.vel = 0;
  }
  componentDidMount() {
    this.idx = 0;
    this.busy = false;
    const N = this.pages.length;
    // le scroll ne pilote plus la page : un geste (molette, glisser, flèches) déclenche une animation de changement
    this.onWheel = (e) => {
      if (this.state.open !== null) return;
      e.preventDefault();
      const dy = e.deltaY;
      if (Math.abs(dy) < 3 || this.busy) return;
      this.go(this.idx + (dy > 0 ? 1 : -1));
    };
    this.onKey = (e) => {
      if (this.state.open !== null) return;
      const k = e.key;
      let dir = 0;
      if (k === 'ArrowDown' || k === 'PageDown' || k === ' ') dir = 1;
      if (k === 'ArrowUp' || k === 'PageUp') dir = -1;
      if (!dir) return;
      e.preventDefault();
      if (!this.busy) this.go(this.idx + dir);
    };
    this.onTouchStart = (e) => { this.ty = e.touches && e.touches[0] ? e.touches[0].clientY : null; this.tdone = false; };
    this.onTouchMove = (e) => {
      if (this.ty == null || this.state.open !== null) return;
      if (e.cancelable) e.preventDefault();
      const y = e.touches && e.touches[0] ? e.touches[0].clientY : this.ty;
      const dy = this.ty - y;
      if (Math.abs(dy) > 40 && !this.tdone && !this.busy) { this.tdone = true; this.go(this.idx + (dy > 0 ? 1 : -1)); }
    };
    window.addEventListener('wheel', this.onWheel, { passive: false });
    window.addEventListener('keydown', this.onKey);
    window.addEventListener('touchstart', this.onTouchStart, { passive: true });
    window.addEventListener('touchmove', this.onTouchMove, { passive: false });
    window.addEventListener('resize', this.onResize = () => this.setState({ rz: Date.now() }));
    setTimeout(() => this.syncVideos(), 300);
    this.syncTimer = setInterval(() => this.syncVideos(), 800);
  }
  // animation de changement : durée fixe, courbe douce, entrée bloquée pendant le mouvement
  tween(from, to, ms, done) {
    const t0 = performance.now();
    const ease = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const step = (now) => {
      const t = Math.min(1, (now - t0) / ms);
      this.setState({ sf: from + (to - from) * ease(t) });
      if (t < 1) { this.raf = requestAnimationFrame(step); } else { this.raf = 0; if (done) done(); }
    };
    this.raf = requestAnimationFrame(step);
  }
  go(target) {
    const N = this.pages.length;
    target = Math.max(0, Math.min(N, target));
    const from = this.idx;
    if (target === from || this.busy) return;
    this.busy = true;
    this.idx = target;
    const finish = () => { setTimeout(() => { this.busy = false; }, 250); };
    if (Math.abs(target - from) === 1) {
      this.tween(from, target, 1700, finish);
    } else {
      // saut de plusieurs pages : la vidéo actuelle sort, puis la cible entre, sans traverser les autres
      const d = target > from ? 1 : -1;
      this.tween(from, from + d * 0.5, 800, () => {
        this.setState({ sf: target - d * 0.5 });
        this.tween(target - d * 0.5, target, 900, finish);
      });
    }
  }
  componentDidUpdate() {
    this.syncVideos();
    this.syncLightbox();
  }
  componentWillUnmount() {
    window.removeEventListener('wheel', this.onWheel);
    window.removeEventListener('keydown', this.onKey);
    window.removeEventListener('touchstart', this.onTouchStart);
    window.removeEventListener('touchmove', this.onTouchMove);
    if (this.onResize) window.removeEventListener('resize', this.onResize);
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.syncTimer) clearInterval(this.syncTimer);
  }
  // seule la page visible joue
  syncVideos() {
    try {
      const P = this.state.sf;
      const lbOpen = this.state.open !== null;
      document.querySelectorAll('video[data-pg]').forEach((v) => {
        const pi = Number(v.getAttribute('data-pg'));
        v.muted = true;
        v.loop = true;
        v.setAttribute('playsinline', '');
        const a = Math.max(0, Math.min(1, (P - (pi - 1) - 0.4) / 0.6));
        const x = Math.max(0, Math.min(1, (P - pi) / 0.6));
        const on = a > 0.001 && x < 0.62 && !lbOpen;
        if (on) {
          if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
        } else if (!v.paused) {
          v.pause();
        }
      });
    } catch (err) {}
  }
  syncLightbox() {
    try {
      const v = document.getElementById('lb-video');
      if (!v) return;
      v.muted = true;
      v.loop = true;
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    } catch (err) {}
  }
  renderVals() {
    const pages = this.pages;
    const N = pages.length;
    const vh = window.innerHeight || 800;
    const vw = window.innerWidth || 1200;
    const P = this.state.sf;
    const open = this.state.open;
    const cl = (v) => Math.max(0, Math.min(1, v));
    const sm = (v) => { const c = cl(v); return c * c * c * (c * (c * 6 - 15) + 10); };
    const padX = Math.max(16, vw * 0.024);
    const topM = 80;
    const botM = 172;
    const Wb = vw - padX * 2;
    const Hb = Math.max(200, vh - topM - botM);
    // liste à plat pour la visionneuse
    const flat = [];
    pages.forEach((pg) => pg.tiles.forEach((t) => flat.push(t)));
    let fi = 0;
    const outPages = pages.map((pg, pi) => {
      // la page sortante sort entièrement (1re moitié du changement) avant que la suivante n'entre (2e moitié)
      const a = cl((P - (pi - 1) - 0.4) / 0.6);
      const x = cl((P - pi) / 0.6);
      const vis = a > 0.001 && x < 0.999;
      const s = Math.min(Wb / pg.uw, Hb / pg.uh);
      const offX = (Wb - pg.uw * s) / 2;
      const offY = (Hb - pg.uh * s) / 2;
      const n = pg.tiles.length;
      const tiles = pg.tiles.map((t, j) => {
        const d = (j / n) * 0.5;
        const ein = sm((a - d) / 0.5);
        const xo = sm((x - d) / 0.5);
        const dir = (pi + j) % 2 ? 1 : -1;
        // sortie 0 → 0,62 de la transition, entrée dès 0,4 : la vidéo sortante est déjà fondue quand l'autre apparaît
        const outO = 1 - sm(Math.min(1, x * 1.6));
        const inO = sm(Math.min(1, a * 1.5));
        const op = Math.min(inO, outO);
        const drift = (P - pi) * dir;
        let tr = '';
        let flt = '';
        let clip = '';
        const blurPx = (1 - ein) * 12 + xo * 12;
        if (pg.type === 'rise') {
          const ty = (1 - ein) * vh * 0.17 - xo * vh * 0.17 + drift * 14;
          const sc = 0.93 + 0.07 * ein + xo * 0.05;
          tr = 'translate3d(0,' + ty.toFixed(1) + 'px,0) scale(' + sc.toFixed(4) + ')';
        } else if (pg.type === 'side') {
          const tx = dir * (1 - ein) * vw * 0.1 - dir * xo * vw * 0.1 + drift * 18;
          const sc = 0.95 + 0.05 * ein + xo * 0.04;
          tr = 'translate3d(' + tx.toFixed(1) + 'px,0,0) scale(' + sc.toFixed(4) + ')';
        } else if (pg.type === 'zoom') {
          const sc = 0.86 + 0.14 * ein + xo * 0.14;
          tr = 'scale(' + sc.toFixed(4) + ') rotate(' + (drift * 0.8).toFixed(2) + 'deg)';
        } else {
          const cut = ((1 - ein) * 22 + xo * 14).toFixed(1);
          clip = dir > 0 ? 'inset(0 ' + cut + '% 0 0)' : 'inset(0 0 0 ' + cut + '%)';
          tr = 'translate3d(' + (dir * (1 - ein) * vw * 0.04 - dir * xo * vw * 0.04).toFixed(1) + 'px,0,0) scale(' + (0.96 + 0.04 * ein).toFixed(4) + ')';
        }
        flt = 'blur(' + blurPx.toFixed(1) + 'px)';
        const my = fi++;
        return {
          pg: pi,
          // seules la vidéo affichée et ses voisines sont chargées : trop de lecteurs vidéo ouverts en même temps donnent des images noires
          src: Math.abs(P - pi) <= 1.2 ? t.src + '#t=0.4' : '',
          cat: t.cat,
          name: t.name,
          aria: t.name,
          style: 'left:' + (offX + t.x * s).toFixed(1) + 'px;top:' + (offY + t.y * s).toFixed(1) + 'px;width:' + (t.w * s).toFixed(1) + 'px;height:' + (t.h * s).toFixed(1) + 'px;transform:' + tr + ';opacity:' + op.toFixed(3) + (flt ? ';filter:' + flt : '') + (clip ? ';clip-path:' + clip : ''),
          open: () => { if (Math.abs(this.state.sf - pi) < 0.5) this.setState({ open: my }); },
        };
      });
      return {
        style: 'position:absolute;left:0;top:0;right:0;bottom:0;z-index:' + (pi + 1) + ';display:' + (vis ? 'block' : 'none') + ';pointer-events:' + (Math.abs(P - pi) < 0.3 ? 'auto' : 'none'),
        box: 'position:absolute;left:' + padX + 'px;top:' + topM + 'px;width:' + Wb + 'px;height:' + Hb + 'px',
        tiles,
      };
    });
    const cur = Math.max(0, Math.min(N - 1, Math.round(P)));
    const footO = sm(cl((P - (N - 1) - 0.4) / 0.6));
    const goTo = (i) => {
      try { window.scrollTo(0, 0); } catch (err) {}
      this.go(i);
    };
    const fx = {
      pages: outPages,
      bar: 'position:absolute;left:clamp(16px,2.4vw,40px);right:clamp(16px,2.4vw,40px);bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;z-index:200;pointer-events:' + (footO > 0.5 ? 'none' : 'auto') + ';opacity:' + (1 - footO).toFixed(3),
      foot: 'position:absolute;left:clamp(16px,2.4vw,40px);right:clamp(16px,2.4vw,40px);bottom:28px;z-index:199;display:' + (footO > 0.001 ? 'block' : 'none') + ';opacity:' + footO.toFixed(3) + ';transform:translateY(' + ((1 - footO) * 40).toFixed(1) + 'px);pointer-events:' + (footO > 0.5 ? 'auto' : 'none'),
      num: String(pages[cur].ci + 1).padStart(3, '0'),
      of: pages[cur].fmt + ' · ' + String(pages[cur].k + 1).padStart(2, '0') + ' / ' + String(pages[cur].n).padStart(2, '0'),
      title: pages[cur].title,
      labelStyle: 'min-width:0;opacity:' + (1 - sm(Math.min(1, Math.abs(P - cur) / 0.32))).toFixed(3) + ';transform:translateY(' + (Math.min(1, Math.abs(P - cur) / 0.32) * 14).toFixed(1) + 'px);filter:blur(' + (Math.min(1, Math.abs(P - cur) / 0.32) * 6).toFixed(1) + 'px)',
      nav: this.cats.map((c) => ({
        num: String(c.ci + 1).padStart(2, '0'),
        name: c.title,
        style: c.ci === pages[cur].ci ? 'color:#D52122;font-weight:700' : 'opacity:.7',
        go: () => goTo(c.first),
      })),
    };
    let lb = { on: false };
    if (open !== null && open !== undefined) {
      const it = flat[open];
      const M = flat.length;
      const go = (d) => this.setState({ open: (open + d + M) % M });
      lb = {
        on: true,
        src: it.src,
        label: it.name + ' · ' + String(open + 1).padStart(2, '0') + ' / ' + String(M).padStart(2, '0'),
        frame: 'position:relative;background:#000;' + (it.v ? 'height:88vh;aspect-ratio:9/16;max-width:92vw' : 'width:min(88vw,156vh);aspect-ratio:16/9'),
        close: () => this.setState({ open: null }),
        stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
        next: (e) => { if (e && e.stopPropagation) e.stopPropagation(); go(1); },
        prev: (e) => { if (e && e.stopPropagation) e.stopPropagation(); go(-1); },
      };
    }
    return { hdr: { color: '#FFF7E5' }, fx, lb };
  }
}
</script>
